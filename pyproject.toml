[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tellascam"
version = "0.1.0"
description = "Machine learning API for detecting suspicious messages"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "joblib",
    "fastapi",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]